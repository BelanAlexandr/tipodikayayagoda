<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск и редактирование товара</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f2f5; padding: 30px; display: flex; flex-direction: column; align-items: center; color: #333; }
        .container { width: 100%; max-width: 550px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 25px; text-align: center; font-size: 22px; color: #111; }
        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #555; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #ccd0d5; border-radius: 10px; outline: none; font-size: 15px; transition: border 0.2s; }
        input:focus { border-color: #2196F3; box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1); }
        
        /* Умный выпадающий список поиска */
        .search-results { 
            position: absolute; width: 100%; background: white; border: 1px solid #ccd0d5; 
            border-radius: 10px; max-height: 280px; overflow-y: auto; z-index: 100; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); margin-top: 5px; display: none; 
        }
        .search-item { display: flex; align-items: center; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; gap: 12px; }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover, .search-item.active { background: #f5f9ff; }
        .search-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: #eee; }
        .search-item .item-info { display: flex; flex-direction: column; }
        .search-item .item-name { font-weight: 600; font-size: 14px; }
        .search-item .item-cat { font-size: 12px; color: #777; margin-top: 2px; }

        /* Блок предпросмотра товара */
        .product-preview { background: #fafafa; border: 1px solid #e4e6eb; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .preview-img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); }
        .preview-text { font-size: 15px; color: #444; line-height: 1.6; margin-bottom: 8px; }
        .preview-text strong { color: #111; }

        .buttons { display: flex; gap: 12px; margin-top: 25px; }
        button { flex: 1; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 15px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .save-btn { background: #00a400; color: white; }
        .back-btn { background: #e4e6eb; color: #4b4f56; }
        
        .back-link-container { margin-top: 20px; text-align: center; }
        .back-link { color: #2196F3; text-decoration: none; font-weight: bold; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        .message { margin-top: 15px; text-align: center; font-weight: bold; padding: 10px; border-radius: 8px; display: none; }
        .success { color: #155724; background: #d4edda; display: block; } 
        .error { color: #721c24; background: #f8d7da; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="pageTitle">Добавить товар в свои предложения</h2>

    <div class="form-group" id="searchGroup">
        <label>Поиск товара по названию</label>
        <input type="text" id="searchProduct" placeholder="Начните вводить название товара..." autocomplete="off">
        <div id="searchResults" class="search-results"></div>
    </div>

    <div id="productPreview" class="product-preview" style="display: none;">
        <img id="previewImg" src="" alt="Фото товара" class="preview-img" onerror="this.onerror=null; this.src='http://localhost:9000/images/default.png';">
        <div class="preview-text"><strong>Категория:</strong> <span id="previewCategory">Загрузка...</span></div>
        <div class="preview-text"><strong>Описание:</strong> <span id="previewDescription"></span></div>
    </div>

    <form id="editForm" style="display: none;">
        <div class="form-group">
            <label>Ваша цена ($)</label>
            <input type="number" id="price" min="0" step="0.01" required placeholder="0.00">
        </div>
        <div class="form-group">
            <label>Количество в наличии (шт.)</label>
            <input type="number" id="count" min="0" required placeholder="0">
        </div>
        <div class="buttons">
            <button type="submit" class="save-btn" id="submitBtn">Создать предложение</button>
            <button type="button" class="back-btn" onclick="goBack()">Назад</button>
        </div>
    </form>

    <div id="backLinkContainer" class="back-link-container">
        <a href="#" class="back-link" onclick="goBack(); return false;">← На главную</a>
    </div>

    <div id="message" class="message"></div>
</div>

<script>
    // Получаем ID авторизованного продавца из контекста Gin
    const userId = Number("{{.UserID}}");

    const params = new URLSearchParams(window.location.search);
    const productIdFromUrl = params.get("id");
    const isEdit = productIdFromUrl !== null;

    let selectedProductId = isEdit ? Number(productIdFromUrl) : null;
    let allCategories = []; 
    let searchTimeout = null;
    let currentFocus = -1; 

    const searchInput = document.getElementById("searchProduct");
    const resultsContainer = document.getElementById("searchResults");

    function goBack() {
        window.location.href = isEdit ? `/product/?id=${selectedProductId}` : "/index";
    }

    async function fetchCategories() {
        try {
            const res = await fetch("/api/categories");
            allCategories = await res.json();
        } catch (e) { console.error("Ошибка загрузки категорий", e); }
    }

    async function searchProductsFromBackend(query) {
        if (!query.trim()) {
            resultsContainer.style.display = "none";
            return;
        }
        try {
            const res = await fetch(`/api/addseller/all?search=${encodeURIComponent(query)}`); 
            const products = await res.json();
            
            renderSearchResults(products);
        } catch (e) { console.error("Ошибка поиска товаров", e); }
    }

    function renderSearchResults(products) {
        resultsContainer.innerHTML = "";
        currentFocus = -1;

        if (products.length === 0) {
            resultsContainer.innerHTML = `<div class="search-item" style="cursor:default; color:#888;">Ничего не найдено</div>`;
            resultsContainer.style.display = "block";
            return;
        }

        products.forEach((product) => {
            const catObj = allCategories.find(c => c.id === Number(product.category_id));
            const catName = catObj ? catObj.name : "Без категории";
            const img = product.img_url || 'http://localhost:9000/images/default.png';

            const item = document.createElement("div");
            item.className = "search-item";
            item.innerHTML = `
                <img src="${img}" onerror="this.onerror=null; this.src='http://localhost:9000/images/default.png';">
                <div class="item-info">
                    <span class="item-name">${product.name}</span>
                    <span class="item-cat">${catName}</span>
                </div>
            `;

            item.addEventListener("click", () => {
                selectProduct(product);
            });

            resultsContainer.appendChild(item);
        });

        resultsContainer.style.display = "block";
    }

    function selectProduct(product) {
        selectedProductId = product.id;
        searchInput.value = product.name;
        resultsContainer.style.display = "none";
        fillProductData(product);
    }

    // ИСПРАВЛЕНО: Умное извлечение старой цены и количества текущего продавца
    function fillProductData(product) {
        const categoryObj = allCategories.find(c => c.id === Number(product.category_id));
        document.getElementById("previewCategory").innerText = categoryObj ? categoryObj.name : "Без категории";
        document.getElementById("previewDescription").innerText = product.description || "Описание отсутствует";
        document.getElementById("previewImg").src = product.img_url || 'http://localhost:9000/images/default.png';
        
        document.getElementById("productPreview").style.display = "block";
        
        let initialPrice = "";
        let initialCount = "";

        // Если есть массив офферов, ищем предложение текущего авторизованного продавца
        if (product.offers && Array.isArray(product.offers)) {
            const myOffer = product.offers.find(o => Number(o.seller_id) === userId);
            if (myOffer) {
                initialPrice = myOffer.price;
                initialCount = myOffer.count;
            }
        }

        // fallback на случай, если структура API на поиске отличается от карточки товара
        document.getElementById("price").value = initialPrice !== "" ? initialPrice : (product.price || product.min_price || "");
        document.getElementById("count").value = initialCount !== "" ? initialCount : (product.count || product.total_count || "");
        
        document.getElementById("editForm").style.display = "block";
        document.getElementById("backLinkContainer").style.display = "none"; 
    }

    searchInput.addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        const query = e.target.value;
        
        searchTimeout = setTimeout(() => {
            searchProductsFromBackend(query);
        }, 300); 
    });

    searchInput.addEventListener("keydown", (e) => {
        let items = resultsContainer.getElementsByClassName("search-item");
        if (items.length === 0 || items[0].style.cursor === "default") return;

        if (e.keyCode === 40) { 
            currentFocus++;
            addActive(items);
        } else if (e.keyCode === 38) { 
            currentFocus--;
            addActive(items);
        } else if (e.keyCode === 13) { 
            e.preventDefault();
            if (currentFocus > -1 && items[currentFocus]) {
                items[currentFocus].click();
            }
        }
    });

    function addActive(items) {
        if (!items) return false;
        removeActive(items);
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = (items.length - 1);
        items[currentFocus].classList.add("active");
        items[currentFocus].scrollIntoView({ block: "nearest" });
    }

    function removeActive(items) {
        for (let i = 0; i < items.length; i++) {
            items[i].classList.remove("active");
        }
    }

    document.addEventListener("click", (e) => {
        if (e.target !== searchInput && e.target !== resultsContainer) {
            resultsContainer.style.display = "none";
        }
    });

    document.getElementById("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("message");
        
        const data = {
            price: parseFloat(document.getElementById("price").value),
            count: parseInt(document.getElementById("count").value)
        };

        let method = isEdit ? "PUT" : "POST"; 
        let url = isEdit 
            ? `/api/offer/update/${selectedProductId}` 
            : `/api/addseller/?id=${selectedProductId}`;

        try {
            const res = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                msg.className = "message success";
                msg.innerText = isEdit ? "Предложение обновлено!" : "Предложение успешно создано!";
                setTimeout(() => { goBack(); }, 1300);
            } else {
                const errText = await res.text();
                msg.className = "message error";
                msg.innerText = "Ошибка: " + errText;
            }
        } catch (err) {
            msg.className = "message error";
            msg.innerText = "Ошибка сети";
        }
    });

    async function init() {
        await fetchCategories();

        if (isEdit) {
            document.getElementById("pageTitle").innerText = "Редактировать предложение";
            document.getElementById("submitBtn").innerText = "Сохранить изменения";
            document.getElementById("searchGroup").style.display = "none";

            try {
                const res = await fetch(`/api/product/?id=${selectedProductId}`);
                if (res.ok) {
                    const product = await res.json();
                    fillProductData(product);
                } else {
                    const msg = document.getElementById("message");
                    msg.className = "message error";
                    msg.innerText = "Товар не найден";
                }
            } catch (e) { console.error(e); }
        }
    }

    init();
</script>
</body>
</html>
